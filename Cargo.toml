[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.0.1"
edition = "2024"
rust-version = "1.87"
license = "MIT"
repository = "https://github.com/Lyncredible/dosy"

[workspace.dependencies]
dosy-core = { path = "crates/dosy-core" }
dosy-vfs = { path = "crates/dosy-vfs" }
dosy-config = { path = "crates/dosy-config" }
dosy-render = { path = "crates/dosy-render" }
log = "0.4"
zip = { version = "7.3", default-features = false, features = ["deflate-flate2-zlib-rs"] }
wgpu = "30"
pollster = "1"
winit = "0.30"

[workspace.lints.rust]
unsafe_code = "deny"

# The CPU interpreter is unusably slow at opt-level 0.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2
